<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example Product - Affiliate Site</title>
    <style>
        body {font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f5f5f5;}
        .container {max-width: 800px; margin: 0 auto; background: white; padding: 20px; box-shadow: 0 0 10px rgba(0,0,0,0.1);}
        .product-image {width: 100%; height: auto; border-radius: 8px;}
        .price {font-size: 24px; color: #e74c3c; margin: 20px 0;}
        .description {line-height: 1.6; color: #495057;}
        .affiliate-link {
            display: inline-block;
            background-color: #3498db;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }
        .affiliate-link:hover {
            background-color: #2980b9;
        }
        .back-link {
            margin-top: 30px;
            display: inline-block;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-link">← Back to all products</a>
        <h1>Example Product</h1>
        <img src="https://via.placeholder.com/300" alt="Example Product" class="product-image">
        <p>This is an example product for your affiliate site.</p>
        <p class="price">$29.99</p>
        <a href="https://example.com/your-affiliate-link?utm_source=affiliate_framework&utm_medium=product_page&utm_campaign=example_product" target="_blank" class="affiliate-link">Buy Now</a>
    </div>
</body>
</html>
