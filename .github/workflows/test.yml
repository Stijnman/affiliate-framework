name: Test Affiliate Framework

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Run site generation
        run: python3 generate_site.py
        
      - name: Verify dist/ exists
        run: |
          if [ ! -d "dist" ]; then
            echo "dist/ directory not created"
            exit 1
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "dist/index.html not created"
            exit 1
          fi

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Run unit tests
        run: |
          python3 -m unittest discover -v -p "test_*.py" || echo "No unit tests found"

  lint:
    name: Lint Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Install markdownlint
        run: |
          npm install -g markdownlint-cli2
          
      - name: Lint all markdown files
        run: |
          find . -name "*.md" -type f -not -path "./.git/*" -exec markdownlint-cli2 --config .markdownlint.json {} \;

  spellcheck:
    name: Spell Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Install codespell
        run: |
          pip install codespell
          
      - name: Check spelling
        run: |
          codespell --skip ".git,*.json,*.yml,*.yaml,CHANGELOG.md" \
            --ignore-words-list "affiliate,framework,JSON,HTML,CSS,http,https" \
            --check-filenames \
            --check-hidden

  security-check:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Check for hardcoded secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified --fail

  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install pre-commit
        run: |
          pip install pre-commit
          
      - name: Install pre-commit hooks
        run: |
          pre-commit install
          
      - name: Run pre-commit on all files
        run: |
          pre-commit run --all-files --show-diff-on-failure || echo "Pre-commit checks completed"
